spring.application.name=document_management
#Hibernate settings
spring.jpa.hibernate.ddl-auto=update
#which actually prints the SQL
spring.jpa.show-sql=true
#The dialect setting tells Hibernate: “Use PostgreSQL‑specific SQL when talking to the database.”
#By default, Hibernate logs SQL as one long line, which is hard to read.

#With format_sql=true, Hibernate adds line breaks and indentation so you can clearly see the structure of the query.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=true
#Driver class name (Spring Boot usually auto‑detects, but you can be explicit)
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration

